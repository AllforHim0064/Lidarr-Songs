# Layer onto the existing Lidarr Songs Compose project.
services:
  cadence:
    build: ./cadence
    image: cadence:local
    restart: unless-stopped
    ports:
      - "${CADENCE_PORT:-8787}:8787"
    environment:
      CADENCE_LIDARR_URL: http://lidarr-tracks:8686
      CADENCE_LIDARR_API_KEY: ${CADENCE_LIDARR_API_KEY:?Set CADENCE_LIDARR_API_KEY in .env}
      CADENCE_ADMIN_USER: ${CADENCE_ADMIN_USER:-admin}
      CADENCE_ADMIN_PASSWORD: ${CADENCE_ADMIN_PASSWORD:?Set CADENCE_ADMIN_PASSWORD in .env}
      CADENCE_SECURE_COOKIE: ${CADENCE_SECURE_COOKIE:-false}
    volumes:
      - ./cadence-data:/data
      - ${MUSIC_PATH:-./music}:/music:ro
    depends_on:
      - lidarr-tracks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
